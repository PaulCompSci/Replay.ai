<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      margin: 0;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 15px 0;
      color: #333;
    }
    p {
      font-size: 12px;
      color: #666;
      margin: 0 0 15px 0;
    }
    button {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      border: none;
      border-radius: 6px;
      background-color: #4CAF50;
      color: white;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s;
    }
    button:hover {
      background-color: #45a049;
    }
    button.secondary {
      background-color: #2196F3;
    }
    button.secondary:hover {
      background-color: #0b7dda;
    }
    button.danger {
      background-color: #f44336;
    }
    button.danger:hover {
      background-color: #da190b;
    }
    .info {
      font-size: 11px;
      color: #999;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid #eee;
    }
  </style>
</head>
<body>
  <h1>Replay.ai</h1>
  <p>Click the recording button on any webpage to start recording interactions.</p>
  
  <button id="printBtn" class="secondary">📋 Print All Events</button>
  <button id="clearBtn" class="danger">🗑️ Clear All Events</button>
  
  <div class="info">
    <strong>Tip:</strong> Use Ctrl+Shift+P (Cmd+Shift+P on Mac) to print events from anywhere.
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
